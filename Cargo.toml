[package]
name = "obsidian-mcp"
version = "4.1.0"
edition = "2024"
description = "MCP server for Obsidian vaults — direct filesystem access for AI agents"
license = "MIT"
repository = "https://github.com/lstpsche/obsidian-mcp"
keywords = ["mcp", "obsidian", "vault", "ai"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
rmcp = { version = "3.5.1", features = ["server", "transport-io", "transport-streamable-http-server"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { package = "yaml_serde", version = "0.10" }
schemars = "1.0"
pulldown-cmark = "0.13"
notify = "8"
notify-debouncer-mini = "0.7"
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
globset = "0.4"
regex = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
unicode-normalization = "0.1.25"
tantivy = "0.26"
fastembed = { version = "6.0.3", optional = true }
tokenizers = { version = "=0.23.2", optional = true, default-features = false, features = ["fancy-regex"] }
tiktoken-rs = { version = "=0.12.1", optional = true, default-features = false }
fs2 = "0.4"
getrandom = "0.4"
sha2 = "0.11"
semver = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
flate2 = "1"
tar = ">=0.4.45, <0.5"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
zeroize = "1"
tempfile = { version = "3", optional = true }
openssh-sftp-client-lowlevel = "0.7.4"
bytes = "1"
futures-util = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1", features = ["event", "fs", "net", "process"] }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
]

[build-dependencies]
cc = "1"

[features]
default = []
embeddings = ["dep:fastembed", "dep:tempfile", "dep:tokenizers"]
embeddings-api = ["dep:tempfile", "dep:tokenizers", "dep:tiktoken-rs", "reqwest/blocking", "reqwest/json"]

[dev-dependencies]
walkdir = "2"
bincode = { version = "2", features = ["serde"] }
jsonschema = { version = "0.33", default-features = false }
tempfile = "3"

[[bin]]
name = "obsidian-mcp"
path = "src/main.rs"

[[bin]]
name = "obsidian-semanticd"
path = "src/bin/obsidian-semanticd.rs"
