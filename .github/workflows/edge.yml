name: Edge Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: edge-release
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  DAEMON_API_VERSION: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            runner: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            runner: macos-latest
            cross: false
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            cross: false
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-edge-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-edge-${{ matrix.target }}-

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          MCP_ARCHIVE="obsidian-mcp-edge-${{ matrix.target }}.tar.gz"
          DAEMON_ARCHIVE="obsidian-semanticd-edge-${{ matrix.target }}.tar.gz"
          tar -czf "$MCP_ARCHIVE" -C target/${{ matrix.target }}/release obsidian-mcp
          tar -czf "$DAEMON_ARCHIVE" -C target/${{ matrix.target }}/release obsidian-semanticd

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $MCP_ARCHIVE = "obsidian-mcp-edge-${{ matrix.target }}.zip"
          $DAEMON_ARCHIVE = "obsidian-semanticd-edge-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/obsidian-mcp.exe" -DestinationPath $MCP_ARCHIVE
          Compress-Archive -Path "target/${{ matrix.target }}/release/obsidian-semanticd.exe" -DestinationPath $DAEMON_ARCHIVE

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            obsidian-mcp-edge-${{ matrix.target }}.*
            obsidian-semanticd-edge-${{ matrix.target }}.*

  release:
    name: Edge GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect archives
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec mv {} release/ \;

      - name: Generate checksums
        working-directory: release
        run: sha256sum * > checksums.sha256

      - name: Delete previous edge release
        run: gh release delete edge --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Create edge release
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          gh release create edge release/* \
            --title "Edge (${CARGO_VERSION}+${SHORT_SHA})" \
            --prerelease \
            --notes "$(cat <<EOF
          Automatic edge build from \`main\` at [\`${SHORT_SHA}\`](https://github.com/${{ github.repository }}/commit/${GITHUB_SHA}).

          > **This is a prerelease.** It reflects the latest \`main\` branch and may be unstable.
          > For stable releases, see the [latest release](https://github.com/${{ github.repository }}/releases/latest).

          ## What's included

          - **obsidian-mcp** — MCP server binary
          - **obsidian-semanticd** — semantic search daemon binary

          ## Semantic daemon compatibility

          - Daemon API version: \`${{ env.DAEMON_API_VERSION }}\`
          EOF
          )"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
