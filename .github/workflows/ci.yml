name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install SFTP fixture
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes openssh-sftp-server

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Rustfmt
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check

      - name: Cargo audit
        if: matrix.os == 'ubuntu-latest'
        run: cargo install cargo-audit && cargo audit

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Tests
        run: cargo test

  windows-embeddings-check:
    name: windows embeddings compile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-embeddings-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-embeddings-cargo-

      - name: Check local embeddings feature
        run: cargo check --all-features

  api-embeddings:
    name: API embeddings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Prepare native SSH fixture
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes openssh-server openssh-sftp-server
          sudo install -d -m 755 /run/sshd

      - name: Prepare Windows native SSH fixture
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $capability = Get-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
          if ($capability.State -ne 'Installed') {
            Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 | Out-Null
          }
          foreach ($tool in 'ssh', 'ssh-keygen', 'sshd') {
            if (!(Test-Path "$env:WINDIR/System32/OpenSSH/$tool.exe")) {
              throw "Native SSH fixture requires $tool.exe"
            }
          }

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-api-embeddings-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-api-embeddings-cargo-

      - name: Clippy API-only build
        run: cargo clippy --locked --no-default-features --features embeddings-api -- -D warnings

      - name: Verify API-only dependency isolation
        shell: bash
        run: |
          cargo tree --locked --no-default-features --features embeddings-api --edges normal --prefix none > api-dependencies.txt
          if grep -E '^(fastembed|ort|ort-sys) v' api-dependencies.txt; then
            echo "API-only builds must not include local inference dependencies" >&2
            exit 1
          fi

      - name: API library, chunking, daemon, SFTP and MCP contracts
        run: cargo test --locked --no-default-features --features embeddings-api --lib --test automatic_chunking_tests --test semantic_daemon_api_tests --test integration_tests --test mcp_transport_tests --test sftp_mcp_tests

      - name: Native SSH authentication and host-key checks
        env:
          OBSIDIAN_TEST_SSH_INTEGRATION: '1'
        run: cargo test --locked --no-default-features --features embeddings-api --test sftp_integration_tests -- --ignored

  upgrade-contract:
    name: upgrade contract (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: embeddings-api
            cache_suffix: embeddings-api
          - features: embeddings
            cache_suffix: embeddings
          - features: embeddings,embeddings-api
            cache_suffix: embeddings-and-api
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-upgrade-${{ matrix.cache_suffix }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-upgrade-

      - name: Verify preserved feature identity and dry-run contract
        run: cargo test --features "${{ matrix.features }}" --test upgrade_cli_tests

      - name: Verify daemon search and restart contract
        if: contains(matrix.features, 'embeddings-api')
        run: cargo test --locked --features "${{ matrix.features }}" --test semantic_daemon_api_tests

  daemon-integration:
    name: daemon integration (embeddings)
    runs-on: ubuntu-latest
    env:
      FASTEMBED_CACHE_DIR: ${{ github.workspace }}/.fastembed_cache
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-daemon-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-daemon-cargo-

      - name: Cache fastembed model artifacts
        uses: actions/cache@v5
        with:
          path: .fastembed_cache
          key: ubuntu-fastembed-cache-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-fastembed-cache-v1-

      - name: Daemon integration tests
        run: cargo test --features embeddings --test daemon_integration_tests

      - name: Local embedding chunking and retrieval
        env:
          OBSIDIAN_EMBEDDING_PROVIDER: local
        run: cargo test --locked --features embeddings --test automatic_chunking_tests
