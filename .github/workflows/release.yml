name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  ARCHIVE_REF: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            features: embeddings,embeddings-api
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            features: embeddings,embeddings-api
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            features: embeddings-api
          - target: aarch64-apple-darwin
            runner: macos-latest
            features: embeddings,embeddings-api
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            features: embeddings,embeddings-api
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --features "${{ matrix.features }}" --target ${{ matrix.target }}
        shell: bash

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          VERSION="${ARCHIVE_REF#v}"
          MCP_ARCHIVE="obsidian-mcp-${VERSION}-${{ matrix.target }}.tar.gz"
          DAEMON_ARCHIVE="obsidian-semanticd-${VERSION}-${{ matrix.target }}.tar.gz"
          tar -czf "$MCP_ARCHIVE" -C target/${{ matrix.target }}/release obsidian-mcp
          tar -czf "$DAEMON_ARCHIVE" -C target/${{ matrix.target }}/release obsidian-semanticd

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VERSION = "$env:ARCHIVE_REF" -replace '^v', ''
          $MCP_ARCHIVE = "obsidian-mcp-${VERSION}-${{ matrix.target }}.zip"
          $DAEMON_ARCHIVE = "obsidian-semanticd-${VERSION}-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/obsidian-mcp.exe" -DestinationPath $MCP_ARCHIVE
          Compress-Archive -Path "target/${{ matrix.target }}/release/obsidian-semanticd.exe" -DestinationPath $DAEMON_ARCHIVE

      - name: Verify native daemon archive
        shell: bash
        run: |
          daemon_host=$(rustc -vV | sed -n 's/^host: //p')
          if [ "${{ matrix.target }}" != "$daemon_host" ]; then
            echo "release archive must be tested on its native host" >&2
            exit 1
          fi
          mkdir daemon-smoke
          daemon_suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            daemon_suffix=".exe"
            python -m zipfile -e obsidian-semanticd-"${ARCHIVE_REF#v}"-${{ matrix.target }}.zip daemon-smoke
          else
            tar -xzf obsidian-semanticd-"${ARCHIVE_REF#v}"-${{ matrix.target }}.tar.gz -C daemon-smoke
          fi
          OBSIDIAN_TEST_DAEMON_BINARY="$PWD/daemon-smoke/obsidian-semanticd$daemon_suffix" cargo test --locked --release --features "${{ matrix.features }}" --target ${{ matrix.target }} --test semantic_daemon_api_tests

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            obsidian-mcp-*-${{ matrix.target }}.*
            obsidian-semanticd-*-${{ matrix.target }}.*

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect archives
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec mv {} release/ \;

      - name: Generate checksums
        working-directory: release
        run: sha256sum * > checksums.sha256

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*

  publish:
    name: Publish to crates.io
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Publish
        run: cargo publish --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
